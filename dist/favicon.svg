<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="70%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  
  <!-- Petals -->
  <g id="petals">
    <!-- 12 petals around circle -->
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(30 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(60 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(90 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(120 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(150 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(180 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(210 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(240 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(270 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(300 50 50)" />
    <path d="M 50 15 C 44 26 44 38 50 42 C 56 38 56 26 50 15 Z" fill="url(#petalGrad)" transform="rotate(330 50 50)" />
  </g>
  
  <!-- Center disk -->
  <circle cx="50" cy="50" r="16" fill="url(#centerGrad)" />
  <circle cx="50" cy="50" r="13" fill="#78350f" stroke="#b45309" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <!-- Cute smile in center -->
  <circle cx="45" cy="48" r="1.8" fill="#fef08a" />
  <circle cx="55" cy="48" r="1.8" fill="#fef08a" />
  <path d="M 46 53 Q 50 57 54 53" stroke="#fef08a" stroke-width="1.4" fill="none" stroke-linecap="round" />
</svg>
